name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the latest revision of each PR/branch should consume Android runners.
# Superseded commits are cancelled so their emulator/build jobs cannot compete
# with the current candidate or leave stale results looking like current validation.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble, verify, and upload debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          # Allow cache writes only for trusted PRs from this repository.
          # Fork PRs remain read-only to prevent cache poisoning.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Assemble debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK package, archive, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SIGNATURE_REPORT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\\n' "$SIGNATURE_REPORT"
          grep -Fq "Signer #1 certificate SHA-256 digest:" <<< "$SIGNATURE_REPORT"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\\n' "$BADGING"
          grep -Fq "package: name='com.antivirusalai' versionCode='4' versionName='0.4.0'" <<< "$BADGING"
          # Fail the build if Android packaging silently drops the launcher icon.
          grep -Eq "^application: .*icon='res/" <<< "$BADGING"
          mkdir -p artifacts
          cp "$APK" artifacts/ANTIVIRUS-AL-AI-v0.4.0-debug.apk
          printf '%s\\n' "$SIGNATURE_REPORT" > artifacts/apk-signature.txt
          CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' <<< "$SIGNATURE_REPORT")"
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.4.0"
            echo "version_code=4"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
            echo "signer_certificate_sha256=${CERT_SHA256}"
            echo "signing_type=DEBUG_ONLY_NOT_FOR_STORE_RELEASE"
          } > artifacts/build-info.txt

      # Upload is intentionally in the build job. Test/lint/emulator failures
      # must not hide an APK that was successfully assembled and verified.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.4.0-debug
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Unit tests and Android lint
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          # Allow cache writes only for trusted PRs from this repository.
          # Fork PRs remain read-only to prevent cache poisoning.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Run native C++ stream matcher tests
        run: |
          set -euo pipefail
          mkdir -p build/native
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            app/src/main/cpp/stream_scanner.cpp \
            app/src/test/native/stream_scanner_test.cpp \
            -o build/native/stream_scanner_test
          ./build/native/stream_scanner_test

      - name: Test threat-feed publisher source merging
        run: |
          python -m pip install --disable-pip-version-check "cryptography>=43,<47" -r tools/requirements-ml.txt
          python -m unittest discover -s tools -p "test_*.py"

      - name: Run unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

  emulator-smoke:
    name: Android startup and instrumentation (API ${{ matrix.api-level }})
    needs: [build-apk, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # API 36 remains exercised and visible, but its emulator image currently
    # has intermittent Package Manager/ADB "Broken pipe" failures on GitHub-hosted runners.
    # API 33 and 35 remain hard gates; API 36 failures are advisory until runner stability recovers.
    continue-on-error: ${{ matrix.api-level == 36 }}
    strategy:
      fail-fast: false
      # Run one emulator at a time. Three concurrent Android VMs exhausted
      # runner ADB/package services and caused false-negative smoke failures.
      max-parallel: 1
      matrix:
        api-level: [33, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          # Allow cache writes only for trusted PRs from this repository.
          # Fork PRs remain read-only to prevent cache poisoning.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Enable KVM access for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::This runner does not expose /dev/kvm; x86_64 emulator tests require a hardware-accelerated runner."
            exit 1
          fi

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          for attempt in $(seq 1 10); do
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              break
            fi
            sleep 1
          done

          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::KVM device exists but is not readable and writable by the runner after applying the udev rule."
            id
            ls -l /dev/kvm || true
            exit 1
          fi

          echo "KVM is available to the emulator runner:"
          ls -l /dev/kvm

      - name: Launch app and run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          emulator-boot-timeout: 1200
          script: gradle --no-daemon connectedDebugAndroidTest --stacktrace

  release-bundle-preflight:
    name: Build and inspect unsigned release AAB
    needs: [build-apk, quality, emulator-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          # Allow cache writes only for trusted PRs from this repository.
          # Fork PRs remain read-only to prevent cache poisoning.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Assemble release AAB (unsigned preflight only)
        run: gradle --no-daemon bundleRelease

      - name: Verify AAB structure and metadata
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -l "$AAB" | grep -q 'base/manifest/AndroidManifest.xml'
          mkdir -p artifacts
          cp "$AAB" artifacts/ANTIVIRUS-AL-AI-v0.4.0-unsigned-preflight.aab
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.4.0"
            echo "version_code=4"
            echo "commit=${GITHUB_SHA}"
            echo "signing=UNSIGNED - NOT FOR PLAY UPLOAD"
            echo "sha256=$(sha256sum "$AAB" | cut -d ' ' -f 1)"
          } > artifacts/aab-build-info.txt

      - name: Upload unsigned AAB preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.4.0-unsigned-aab-preflight
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
