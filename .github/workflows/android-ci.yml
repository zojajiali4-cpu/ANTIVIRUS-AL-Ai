name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an active validation run just because a newer commit was pushed.
# Isolate each source revision so a stuck emulator run for an older commit
# cannot keep the newest revision queued behind the same PR concurrency group.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Assemble, verify, and upload debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Assemble debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK package, archive, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SIGNATURE_REPORT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\\n' "$SIGNATURE_REPORT"
          grep -Fq "Signer #1 certificate SHA-256 digest:" <<< "$SIGNATURE_REPORT"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.antivirusalai' versionCode='3' versionName='0.3.0'"
          mkdir -p artifacts
          cp "$APK" artifacts/ANTIVIRUS-AL-AI-v0.3.0-debug.apk
          printf '%s\\n' "$SIGNATURE_REPORT" > artifacts/apk-signature.txt
          CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' <<< "$SIGNATURE_REPORT")"
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.3.0"
            echo "version_code=3"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
            echo "signer_certificate_sha256=${CERT_SHA256}"
            echo "signing_type=DEBUG_ONLY_NOT_FOR_STORE_RELEASE"
          } > artifacts/build-info.txt

      # Upload is intentionally in the build job. Test/lint/emulator failures
      # must not hide an APK that was successfully assembled and verified.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.3.0-debug
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Unit tests and Android lint
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Run native C++ stream matcher tests
        run: |
          set -euo pipefail
          mkdir -p build/native
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            app/src/main/cpp/stream_scanner.cpp \
            app/src/test/native/stream_scanner_test.cpp \
            -o build/native/stream_scanner_test
          ./build/native/stream_scanner_test

      - name: Test threat-feed publisher source merging
        run: |
          python -m pip install --disable-pip-version-check "cryptography>=43,<47" -r tools/requirements-ml.txt
          python -m unittest discover -s tools -p "test_*.py"

      - name: Run unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

  emulator-smoke:
    name: Android startup and instrumentation (API ${{ matrix.api-level }})
    needs: [build-apk, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Run one emulator at a time. Three concurrent Android VMs exhausted
      # runner ADB/package services and caused false-negative smoke failures.
      max-parallel: 1
      matrix:
        api-level: [33, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Launch app and run instrumentation tests
        shell: bash
        # Start the emulator directly so the workflow can wait for Android framework
        # services, not only sys.boot_completed, before issuing input/PackageManager calls.
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          set -Eeuo pipefail
          SDKMANAGER_DIR="$(dirname "$(command -v sdkmanager)")"
          AVDMANAGER="$SDKMANAGER_DIR/avdmanager"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          AVD_NAME="antivirus-api-$API_LEVEL"
          EMULATOR_LOG="$RUNNER_TEMP/emulator-$API_LEVEL.log"

          "$SDKMANAGER_DIR/sdkmanager" "emulator" "system-images;android-$API_LEVEL;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd --force --name "$AVD_NAME" \
            --package "system-images;android-$API_LEVEL;google_apis;x86_64" --device pixel_2

          "$ADB" start-server
          "$EMULATOR" -avd "$AVD_NAME" -port 5554 -no-window -gpu swiftshader_indirect \
            -noaudio -no-boot-anim -no-snapshot -wipe-data -accel off >"$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!

          cleanup() {
            local status=$?
            trap - EXIT
            if (( status != 0 )); then
              echo "::group::Emulator diagnostics (API $API_LEVEL)"
              "$ADB" -s emulator-5554 logcat -d -b all -t 2000 2>&1 \
                | grep -Ei "system_server|PackageManager|InputManager|FATAL EXCEPTION|lowmemory|lmkd|OutOfMemory|Watchdog|ANR" \
                | tail -n 120 || true
              tail -n 120 "$EMULATOR_LOG" || true
              echo "::endgroup::"
            fi
            "$ADB" -s emulator-5554 emu kill >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          "$ADB" -s emulator-5554 wait-for-device
          booted=false
          for attempt in $(seq 1 240); do
            if [[ "$("$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == "1" ]]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [[ "$booted" != true ]]; then
            echo "::error::Emulator API $API_LEVEL did not complete boot within 20 minutes."
            exit 1
          fi

          wait_for_service() {
            local service="$1"
            for attempt in $(seq 1 90); do
              if "$ADB" -s emulator-5554 shell service check "$service" 2>&1 | grep -Eq ':[[:space:]]*found[[:space:]]*$'; then
                echo "Android service '$service' is ready (attempt $attempt/90)."
                return 0
              fi
              sleep 2
            done
            echo "::error::Android service '$service' did not become ready on API $API_LEVEL."
            return 1
          }

          # sys.boot_completed can precede registration of framework services.
          # Wait for both services before the unlock keyevent and APK installation.
          wait_for_service input
          wait_for_service package

          package_ready=false
          for attempt in $(seq 1 60); do
            if timeout 10s "$ADB" -s emulator-5554 shell cmd package list packages >/dev/null 2>&1; then
              package_ready=true
              echo "Package Manager responds to package queries (attempt $attempt/60)."
              break
            fi
            sleep 2
          done
          if [[ "$package_ready" != true ]]; then
            echo "::error::Package Manager stayed unavailable on API $API_LEVEL."
            exit 1
          fi

          "$ADB" -s emulator-5554 shell input keyevent 82
          "$ADB" -s emulator-5554 shell settings put global window_animation_scale 0
          "$ADB" -s emulator-5554 shell settings put global transition_animation_scale 0
          "$ADB" -s emulator-5554 shell settings put global animator_duration_scale 0
          gradle --no-daemon connectedDebugAndroidTest --stacktrace

  release-bundle-preflight:
    name: Build and inspect unsigned release AAB
    needs: [build-apk, quality, emulator-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Assemble release AAB (unsigned preflight only)
        run: gradle --no-daemon bundleRelease

      - name: Verify AAB structure and metadata
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -l "$AAB" | grep -q 'base/manifest/AndroidManifest.xml'
          mkdir -p artifacts
          cp "$AAB" artifacts/ANTIVIRUS-AL-AI-v0.3.0-unsigned-preflight.aab
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.3.0"
            echo "version_code=3"
            echo "commit=${GITHUB_SHA}"
            echo "signing=UNSIGNED - NOT FOR PLAY UPLOAD"
            echo "sha256=$(sha256sum "$AAB" | cut -d ' ' -f 1)"
          } > artifacts/aab-build-info.txt

      - name: Upload unsigned AAB preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.3.0-unsigned-aab-preflight
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
