name: Android CI

on:
  push:
    branches: [main, "feature/cloud-safe-cleaner-signing-v1", "feature/url-risk-analysis-foundation"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALAI_RELEASE_KEYSTORE_BASE64: ${{ secrets.ALAI_RELEASE_KEYSTORE_BASE64 }}
      ALAI_RELEASE_STORE_PASSWORD: ${{ secrets.ALAI_RELEASE_STORE_PASSWORD }}
      ALAI_RELEASE_KEY_ALIAS: ${{ secrets.ALAI_RELEASE_KEY_ALIAS }}
      ALAI_RELEASE_KEY_PASSWORD: ${{ secrets.ALAI_RELEASE_KEY_PASSWORD }}
      ALAI_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Run unit tests, lint, and debug build
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug
      - name: Label APK and write build identity
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ANTIVIRUS-AL-AI-v0.2.0-debug.apk
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.2.0"
            echo "version_code=${ALAI_VERSION_CODE}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > app/build/outputs/apk/debug/build-info.txt
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.2.0-debug
          path: |
            app/build/outputs/apk/debug/ANTIVIRUS-AL-AI-v0.2.0-debug.apk
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Prepare protected release keystore
        if: ${{ env.ALAI_RELEASE_KEYSTORE_BASE64 != '' && env.ALAI_RELEASE_STORE_PASSWORD != '' && env.ALAI_RELEASE_KEY_ALIAS != '' && env.ALAI_RELEASE_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/alai-release-upload.jks"
          printf '%s' "$ALAI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ALAI_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.ALAI_RELEASE_KEYSTORE_BASE64 != '' && env.ALAI_RELEASE_STORE_PASSWORD != '' && env.ALAI_RELEASE_KEY_ALIAS != '' && env.ALAI_RELEASE_KEY_PASSWORD != '' }}
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK signature
        if: ${{ env.ALAI_RELEASE_KEYSTORE_BASE64 != '' && env.ALAI_RELEASE_STORE_PASSWORD != '' && env.ALAI_RELEASE_KEY_ALIAS != '' && env.ALAI_RELEASE_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload verified release APK
        if: ${{ env.ALAI_RELEASE_KEYSTORE_BASE64 != '' && env.ALAI_RELEASE_STORE_PASSWORD != '' && env.ALAI_RELEASE_KEY_ALIAS != '' && env.ALAI_RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Explain release signing was not run
        if: ${{ env.ALAI_RELEASE_KEYSTORE_BASE64 == '' || env.ALAI_RELEASE_STORE_PASSWORD == '' || env.ALAI_RELEASE_KEY_ALIAS == '' || env.ALAI_RELEASE_KEY_PASSWORD == '' }}
        run: echo "Release signing skipped because one or more ALAI release GitHub Actions secrets are not configured. Debug validation still runs."
