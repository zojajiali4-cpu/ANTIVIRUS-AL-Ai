name: Cloud API CI

on:
  push:
    paths:
      - "cloud-api/**"
      - ".github/workflows/cloud-api-ci.yml"
  pull_request:
    paths:
      - "cloud-api/**"
      - ".github/workflows/cloud-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-api-ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  worker-tests:
    name: Cloud Worker security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run dependency-free Worker tests
        working-directory: cloud-api
        run: npm test
