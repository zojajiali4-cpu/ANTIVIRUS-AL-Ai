name: Threat feed publisher tests

on:
  push:
    paths:
      - "tools/publish_threat_feed.py"
      - "tools/test_publish_threat_feed.py"
      - "tools/requirements-threat-feed.txt"
      - ".github/workflows/threat-feed-publisher-ci.yml"
  pull_request:
    paths:
      - "tools/publish_threat_feed.py"
      - "tools/test_publish_threat_feed.py"
      - "tools/requirements-threat-feed.txt"
      - ".github/workflows/threat-feed-publisher-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publisher test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-threat-feed.txt
      - name: Run threat feed publisher unit tests
        working-directory: tools
        run: python -m unittest -v test_publish_threat_feed.py
